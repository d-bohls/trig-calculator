name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# what the deploy needs: read the code, publish a Pages artifact, and prove
# who it is when it does
permissions:
  contents: read
  pages: write
  id-token: write

# a queued deploy replaces an in-flight one rather than racing it
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # one source for the version, shared with anyone running it locally
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # the deploy is the only gate this project has, so it checks before it
      # publishes rather than after
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
